<script type="text/babel" data-presets="env,react">
function App({ standalone }){
  const [tab,setTab]=React.useState('home');
  return (
    <AppShell tab={tab} onTab={setTab} standalone={standalone}>
      {tab==='home' ? <HomeScreen onOpen={setTab}/> : null}
      {tab==='cactpot' ? <SolverScreen/> : null}
      {tab==='about' ? <AboutScreen/> : null}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App standalone/>);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
